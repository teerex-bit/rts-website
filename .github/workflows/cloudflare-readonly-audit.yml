name: Temporary Cloudflare read-only audit
# rerun after audit token installation

on:
  push:
    branches:
      - audit/cloudflare-readonly-2026-09-24
    paths:
      - .github/workflows/cloudflare-readonly-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_NAME: reformingthesoul.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/cloudflare-readonly-2026-09-24

      - name: Verify CLOUDFLARE_AUDIT_TOKEN
        shell: bash
        run: |
          test -n "$CF_API_TOKEN" || { echo "CLOUDFLARE_AUDIT_TOKEN is missing"; exit 1; }

      - name: Verify CLOUDFLARE_ACCOUNT_ID
        if: always()
        shell: bash
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Query Cloudflare read-only APIs and create filtered report
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = "https://api.cloudflare.com/client/v4"
          TOKEN = os.environ["CF_API_TOKEN"]
          ACCOUNT = os.environ["CF_ACCOUNT_ID"]
          ZONE_NAME = os.environ["CF_ZONE_NAME"]
          TARGET_NAMES = {ZONE_NAME, f"www.{ZONE_NAME}", f"review.{ZONE_NAME}"}
          KEYWORDS = ("rts", "reforming", "overview", "website", "review")

          def api(path, query=None):
              url = BASE + path
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Content-Type": "application/json",
                  "User-Agent": "rts-read-only-audit/1.0",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = json.load(response)
                  return {"ok": bool(body.get("success")), "result": body.get("result"), "errors": body.get("errors", [])}
              except urllib.error.HTTPError as exc:
                  try:
                      body = json.load(exc)
                  except Exception:
                      body = {"errors": [{"message": str(exc)}]}
                  return {"ok": False, "result": None, "errors": body.get("errors", [])}
              except Exception as exc:
                  return {"ok": False, "result": None, "errors": [{"message": str(exc)}]}

          def err_text(value):
              return "; ".join(str(x.get("message", x)) for x in value.get("errors", [])) or "unknown API error"

          def relevant(name):
              value = (name or "").lower()
              return any(word in value for word in KEYWORDS)

          audit = {
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "zone_name": ZONE_NAME,
              "token_verify": api("/user/tokens/verify"),
          }

          zones = api("/zones", {"name": ZONE_NAME, "account.id": ACCOUNT, "per_page": 50})
          audit["zone_lookup"] = zones
          zone_items = zones.get("result") or []
          zone_id = zone_items[0].get("id") if zone_items else None

          if zone_id:
              dns = api(f"/zones/{zone_id}/dns_records", {"per_page": 500})
              records = []
              for record in dns.get("result") or []:
                  if record.get("name") in TARGET_NAMES:
                      records.append({k: record.get(k) for k in ("name", "type", "content", "proxied", "ttl", "comment", "tags")})
              audit["relevant_dns"] = {"ok": dns["ok"], "result": records, "errors": dns["errors"]}

              routes = api(f"/zones/{zone_id}/workers/routes")
              route_rows = []
              for route in routes.get("result") or []:
                  pattern = route.get("pattern", "")
                  script = route.get("script", "") or route.get("script_name", "")
                  if ZONE_NAME in pattern or relevant(script):
                      route_rows.append({k: route.get(k) for k in ("pattern", "script", "script_name") if k in route})
              audit["relevant_worker_routes"] = {"ok": routes["ok"], "result": route_rows, "errors": routes["errors"]}
          else:
              audit["relevant_dns"] = {"ok": False, "result": [], "errors": [{"message": "Zone not found"}]}
              audit["relevant_worker_routes"] = {"ok": False, "result": [], "errors": [{"message": "Zone not found"}]}

          scripts = api(f"/accounts/{ACCOUNT}/workers/scripts")
          script_rows = []
          for script in scripts.get("result") or []:
              name = script.get("id") or script.get("name")
              if not relevant(name):
                  continue
              row = {k: script.get(k) for k in (
                  "id", "name", "created_on", "modified_on", "last_deployed_from",
                  "compatibility_date", "compatibility_flags", "usage_model", "handlers",
              ) if k in script}
              settings = api(f"/accounts/{ACCOUNT}/workers/scripts/{urllib.parse.quote(name, safe='')}/settings")
              deployments = api(f"/accounts/{ACCOUNT}/workers/scripts/{urllib.parse.quote(name, safe='')}/deployments")
              if settings.get("ok") and isinstance(settings.get("result"), dict):
                  s = settings["result"]
                  row["settings"] = {k: s.get(k) for k in (
                      "compatibility_date", "compatibility_flags", "usage_model", "logpush", "tail_consumers",
                  ) if k in s}
                  bindings = []
                  for binding in s.get("bindings") or []:
                      bindings.append({k: binding.get(k) for k in ("name", "type", "namespace_id", "service", "environment") if k in binding})
                  row["settings"]["bindings"] = bindings
              else:
                  row["settings_error"] = err_text(settings)
              if deployments.get("ok"):
                  dep_result = deployments.get("result") or {}
                  dep_items = dep_result.get("deployments", []) if isinstance(dep_result, dict) else dep_result
                  row["recent_deployments"] = [
                      {k: d.get(k) for k in ("id", "created_on", "source", "strategy") if k in d}
                      for d in (dep_items or [])[:5]
                  ]
              else:
                  row["deployments_error"] = err_text(deployments)
              script_rows.append(row)
          audit["relevant_workers"] = {"ok": scripts["ok"], "result": script_rows, "errors": scripts["errors"]}

          domains = api(f"/accounts/{ACCOUNT}/workers/domains")
          domain_rows = []
          for domain in domains.get("result") or []:
              hostname = domain.get("hostname", "")
              service = domain.get("service", "")
              if hostname in TARGET_NAMES or relevant(service):
                  domain_rows.append({k: domain.get(k) for k in ("hostname", "service", "environment", "zone_name") if k in domain})
          audit["relevant_worker_custom_domains"] = {"ok": domains["ok"], "result": domain_rows, "errors": domains["errors"]}

          pages = api(f"/accounts/{ACCOUNT}/pages/projects", {"per_page": 100})
          page_rows = []
          for project in pages.get("result") or []:
              name = project.get("name", "")
              domains_list = project.get("domains") or []
              if not (relevant(name) or any(d in TARGET_NAMES for d in domains_list)):
                  continue
              row = {k: project.get(k) for k in (
                  "name", "subdomain", "domains", "production_branch", "created_on",
              ) if k in project}
              source = project.get("source")
              if isinstance(source, dict):
                  config = source.get("config") or {}
                  row["source"] = {
                      "type": source.get("type"),
                      "config": {k: config.get(k) for k in (
                          "owner", "repo_name", "production_branch", "deployments_enabled",
                          "production_deployment_enabled", "preview_deployment_setting", "pr_comments_enabled",
                      ) if k in config},
                  }
              production = project.get("canonical_deployment") or project.get("latest_deployment")
              if isinstance(production, dict):
                  row["latest_deployment"] = {k: production.get(k) for k in (
                      "id", "url", "environment", "created_on", "modified_on", "latest_stage",
                  ) if k in production}
                  dep_source = production.get("source")
                  if isinstance(dep_source, dict):
                      row["latest_deployment"]["source"] = {k: dep_source.get(k) for k in ("type", "config") if k in dep_source}
              custom = api(f"/accounts/{ACCOUNT}/pages/projects/{urllib.parse.quote(name, safe='')}/domains")
              if custom.get("ok"):
                  row["custom_domains"] = [
                      {k: d.get(k) for k in ("name", "status", "verification_data", "validation_data") if k in d}
                      for d in (custom.get("result") or [])
                  ]
              else:
                  row["custom_domains_error"] = err_text(custom)
              page_rows.append(row)
          audit["relevant_pages_projects"] = {"ok": pages["ok"], "result": page_rows, "errors": pages["errors"]}

          # Store only website-relevant, filtered metadata. Token, account ID, zone ID,
          # unrelated DNS records, and secret binding values are never written.
          out = pathlib.Path("audit-results")
          out.mkdir(exist_ok=True)
          (out / "cloudflare-filtered.json").write_text(json.dumps(audit, indent=2, sort_keys=True) + "\n")

          lines = [
              "# Cloudflare Read-only Audit (Filtered)",
              "",
              f"Generated: `{audit['generated_at']}`",
              f"Zone: `{ZONE_NAME}`",
              "",
              "This report contains only website-relevant metadata. No Cloudflare resource was modified.",
              "",
          ]
          for title, key in (
              ("Relevant DNS", "relevant_dns"),
              ("Relevant Worker routes", "relevant_worker_routes"),
              ("Relevant Worker custom domains", "relevant_worker_custom_domains"),
              ("Relevant Workers", "relevant_workers"),
              ("Relevant Pages projects", "relevant_pages_projects"),
          ):
              value = audit[key]
              lines += [f"## {title}", "", f"API success: **{value.get('ok')}**", "", "```json", json.dumps(value.get("result"), indent=2, sort_keys=True), "```", ""]
              if value.get("errors"):
                  lines += ["Errors: `" + err_text(value) + "`", ""]
          (out / "REPORT.md").write_text("\n".join(lines))
          PY

      - name: Commit filtered audit result to isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-results/REPORT.md audit-results/cloudflare-filtered.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record temporary Cloudflare read-only audit"
          git push origin HEAD:audit/cloudflare-readonly-2026-09-24
