name: Deploy RTS website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rts-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Run project checks
        run: npm run check

      - name: Commit website generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --             public/index.html             public/about             public/contact             public/conversations             public/books             public/music             public/assets/page-00-approved.css             public/assets/info-pages.css             public/assets/about-page.css             public/assets/trey-malea.jpg             public/assets/conversations-approved.css             public/assets/styles.css             public/assets/site.js             public/assets/brand-main-transparent.png             public/assets/logo-circle.svg             public/assets/logo-light.svg             public/assets/page-01             public/assets/page-ranges/range-36-40
          if git diff --cached --quiet; then
            echo "No generated website changes to commit."
          else
            git commit -m "build: sync website generated public output"
            git push origin HEAD:main
          fi

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
