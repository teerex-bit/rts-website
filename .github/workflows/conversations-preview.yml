name: Conversations preview

on:
  push:
    branches:
      - codex/build-complete-reforming-the-soul-website-ce2woj

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run serve > /tmp/rts-preview.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/conversations/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/rts-preview.log
          exit 1
      - run: npm run check:browser
      - uses: actions/upload-artifact@v4
        with:
          name: conversations-preview
          path: |
            artifacts/conversations-desktop.png
            artifacts/conversations-mobile.png
