name: Deploy exact RTS website review Worker

on:
  push:
    branches:
      - ops/deploy-rts-website-review-2026-09-24
    paths:
      - .github/workflows/deploy-review-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the authorized review commit
        uses: actions/checkout@v4
        with:
          ref: eb70296a30182ec67aa8bbe01172cbc63796c89e
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy only the review Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.86.0 deploy 2>&1 | tee /tmp/wrangler-deploy.log
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path("/tmp/wrangler-deploy.log").read_text()
          matches = re.findall(r"https://[a-zA-Z0-9-]+\.workers\.dev", text)
          if not matches:
              raise SystemExit("Wrangler output did not include a workers.dev URL")
          print("url=" + matches[-1])
          PY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check review pages, Spotify embed, navigation targets, and assets
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen
          import os
          from urllib.parse import urljoin, urlparse

          base = os.environ["WORKER_URL"].rstrip("/") + "/"

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ("href", "src"):
                      value = values.get(key, "")
                      if value and value.startswith("/") and not value.startswith("//"):
                          self.refs.append(value)

          def fetch(path):
              url = urljoin(base, path.lstrip("/"))
              try:
                  response = urlopen(url, timeout=25)
                  data = response.read()
                  if response.status != 200:
                      raise RuntimeError(f"{url}: HTTP {response.status}")
                  return data.decode("utf-8", errors="replace")
              except (HTTPError, URLError) as exc:
                  raise RuntimeError(f"{url}: {exc}") from exc

          routes = ["/", "/formation/", "/conversations/", "/music/", "/about/", "/contact/"]
          html = {}
          for route in routes:
              html[route] = fetch(route)
              print(f"PASS {route} HTTP 200")
          music = html["/music/"].lower()
          if "open.spotify.com/embed" not in music and "spotify" not in music:
              raise SystemExit("Music page has no Spotify embed reference")
          print("PASS Music page contains Spotify embed reference")

          expected_nav = ("/formation/", "/conversations/", "/music/")
          home = html["/"]
          for target in expected_nav:
              if target not in home:
                  raise SystemExit(f"Homepage is missing navigation target {target}")
          print("PASS Homepage navigation targets are present")

          refs = set()
          for page in html.values():
              parser = Links()
              parser.feed(page)
              refs.update(parser.refs)
          checked = 0
          for ref in sorted(refs):
              parsed = urlparse(ref)
              if parsed.path.endswith((".html", ".css", ".js", ".svg", ".png", ".webp", ".jpg", ".jpeg", ".woff", ".woff2")):
                  fetch(ref)
                  checked += 1
          if checked == 0:
              raise SystemExit("No local static assets were discovered to verify")
          print(f"PASS {checked} linked local static resources HTTP 200")
          PY