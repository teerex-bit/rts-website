name: Deploy exact RTS website review Worker

on:
  push:
    branches:
      - ops/deploy-rts-website-review-2026-09-24
    paths:
      - .github/workflows/deploy-review-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the authorized review commit
        uses: actions/checkout@v4
        with:
          ref: eb70296a30182ec67aa8bbe01172cbc63796c89e
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy only the review Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.86.0 deploy 2>&1 | tee /tmp/wrangler-deploy.log
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path("/tmp/wrangler-deploy.log").read_text()
          matches = re.findall(r"https://[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*\.workers\.dev", text)
          if not matches:
              raise SystemExit("Wrangler output did not include a workers.dev URL")
          print("url=" + matches[-1])
          PY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

