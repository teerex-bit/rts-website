name: Deploy website candidate to review

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Exact commit SHA to deploy to rts-website-review"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rts-website-review-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy-review:
    runs-on: ubuntu-latest
    env:
      EXPECTED_REPOSITORY: teerex-bit/rts-website
      EXPECTED_WORKER: rts-website-review
      PRODUCTION_WORKER: rts-website
      EXPECTED_ASSET_DIRECTORY: ./public
      REVIEW_ORIGIN: https://review.reformingthesoul.com
    steps:
      - name: Verify workflow has no unrelated infrastructure operations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet --target "$RUNNER_TEMP/rts-review-guard" PyYAML==6.0.3
          PYTHONPATH="$RUNNER_TEMP/rts-review-guard" python3 <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import urllib.request
          import yaml

          GUARD_NAME = "Verify workflow has no unrelated infrastructure operations"
          # Fingerprint of the reviewed execution structure, not the workflow's prose.
          # Any new command, action, job, env override, or changed safety check fails closed.
          APPROVED_EXECUTION_SHA256 = "8822f41327e56beb82fbd9648090cb7ce7a9cc98e993f77c6cda51d9e7a03f95"

          class UniqueLoader(yaml.SafeLoader):
              pass

          def unique_mapping(loader, node):
              result = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=True)
                  if key in result:
                      raise ValueError("Duplicate workflow key")
                  result[key] = loader.construct_object(value_node, deep=True)
              return result

          UniqueLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, unique_mapping)

          def normalize(value):
              if isinstance(value, dict):
                  result = {}
                  for key, item in value.items():
                      if key == "name" and any(field in value for field in ("jobs", "runs-on", "run", "uses")):
                          continue  # YAML display text is not executable.
                      if key == "run" and isinstance(item, str):
                          lines = []
                          for line in item.splitlines():
                              text = line.strip()
                              if not text or text.startswith(("#", "//")):
                                  continue
                              # Only standalone, literal echo output; substitutions and
                              # shell operators outside the quotes remain executable.
                              if re.fullmatch(r'''echo (?:"[^"$`\\]*"|'[^']*')''', text):
                                  continue
                              lines.append(line.rstrip())
                          result[str(key)] = "\n".join(lines)
                      else:
                          result[str(key)] = normalize(item)
                  return result
              if isinstance(value, list):
                  return [normalize(item) for item in value]
              return value

          def validate_workflow(source):
              workflow = yaml.load(source, Loader=UniqueLoader)
              steps = workflow["jobs"]["validate-and-deploy-review"]["steps"]
              if not steps or steps[0].get("name") != GUARD_NAME:
                  raise ValueError("Execution guard must be the first step")
              guard = dict(steps[0])
              guard.pop("run", None)  # The executing validator does not inspect itself.
              if guard != {
                  "name": GUARD_NAME, "shell": "bash",
                  "env": {"GH_TOKEN": "$" + "{{ github.token }}", "WORKFLOW_SHA": "$" + "{{ github.workflow_sha }}"},
              }:
                  raise ValueError("Unexpected execution guard settings")
              workflow["jobs"]["validate-and-deploy-review"]["steps"] = steps[1:]
              encoded = json.dumps(normalize(workflow), sort_keys=True, separators=(",", ":")).encode()
              if hashlib.sha256(encoded).hexdigest() != APPROVED_EXECUTION_SHA256:
                  raise ValueError("Unapproved executable command or workflow setting; refusing deployment")

          if __name__ == "__main__":
              if os.environ["GITHUB_REPOSITORY"] != "teerex-bit/rts-website":
                  raise ValueError("Unexpected repository")
              workflow_sha = os.environ["WORKFLOW_SHA"]
              if not re.fullmatch(r"[0-9a-f]{40}", workflow_sha):
                  raise ValueError("Expected exact workflow commit")
              # Inspect the workflow that is running, not the different candidate checkout.
              url = ("https://api.github.com/repos/teerex-bit/rts-website/contents/"
                     ".github/workflows/deploy-website-review.yml?ref=" + workflow_sha)
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github.raw+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  source = response.read().decode("utf-8")
              validate_workflow(source)
              print("Approved review-only execution structure at workflow SHA " + workflow_sha)
          PYTHON

      - name: Validate requested candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          candidate="${{ inputs.candidate }}"
          if [[ ! "$candidate" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate must be an exact 40-character commit SHA"
            exit 1
          fi
          echo "Requested candidate SHA: $candidate"

      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          requested="$(printf '%s' "${{ inputs.candidate }}" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD)"
          echo "Requested SHA: $requested"
          echo "Checked-out SHA: $actual"
          test "$actual" = "$requested"
          echo "DEPLOY_SHA=$actual" >> "$GITHUB_ENV"

      - name: Fail closed on review Worker configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const raw = fs.readFileSync("wrangler.jsonc", "utf8")
            .replace(/^\s*\/\/.*$/gm, "")
            .replace(/\/\*[\s\S]*?\*\//g, "")
            .replace(/,\s*([}\]])/g, "$1");
          const cfg = JSON.parse(raw);
          const expectedWorker = process.env.EXPECTED_WORKER;
          const productionWorker = process.env.PRODUCTION_WORKER;
          const expectedAssets = process.env.EXPECTED_ASSET_DIRECTORY;
          if (cfg.name !== expectedWorker) throw new Error(`FAIL CLOSED: wrangler name is ${cfg.name}; expected ${expectedWorker}`);
          if (cfg.name === productionWorker) throw new Error("FAIL CLOSED: production Worker selected");
          if (!cfg.assets || cfg.assets.directory !== expectedAssets) throw new Error(`FAIL CLOSED: assets.directory must be ${expectedAssets}`);
          const serialized = JSON.stringify(cfg);
          for (const forbidden of ["reformingthesoul.com", "www.reformingthesoul.com"]) {
            if (serialized.includes(forbidden)) throw new Error(`FAIL CLOSED: production domain appears in review wrangler config: ${forbidden}`);
          }
          for (const forbiddenKey of ["routes", "route"]) {
            if (Object.prototype.hasOwnProperty.call(cfg, forbiddenKey)) throw new Error(`FAIL CLOSED: review config must not mutate ${forbiddenKey}`);
          }
          console.log(`Repository guard: ${process.env.GITHUB_REPOSITORY}`);
          console.log(`Review Worker guard: ${cfg.name}`);
          console.log(`Static assets: ${cfg.assets.directory}`);
          console.log("No route/custom-domain mutation configured.");
          NODE
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test -d public

      - name: Run website automated tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs

      - name: Run diff whitespace validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^

      - name: Deploy exact candidate to review Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test "$EXPECTED_WORKER" = "rts-website-review"
          test "$PRODUCTION_WORKER" = "rts-website"
          echo "Deploying exact SHA $DEPLOY_SHA to review Worker $EXPECTED_WORKER"
          npx --yes wrangler@4.86.0 deploy --config wrangler.jsonc

      - name: Verify review website
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "/"
            "/formation/"
            "/awaken/lesson-1/"
            "/awaken/lesson-2/"
            "/see-clearly/"
            "/become/"
            "/join/"
            "/conversations/"
            "/music/"
            "/about/"
            "/contact/"
          )
          for path in "${paths[@]}"; do
            url="$REVIEW_ORIGIN$path"
            code="$(curl --fail-with-body --silent --show-error --location --output /tmp/rts-page --write-out '%{http_code}' "$url")"
            test "$code" -ge 200
            test "$code" -lt 400
            grep -qi "Reforming the Soul" /tmp/rts-page
            echo "$path -> HTTP $code"
          done
          curl --fail-with-body --silent --show-error --location "$REVIEW_ORIGIN/music/" -o /tmp/rts-music
          grep -Eqi 'open\.spotify\.com/embed|spotify' /tmp/rts-music
          if grep -Eqi 'https?://(www\.)?reformingthesoul\.com' /tmp/rts-page /tmp/rts-music; then
            echo "::error::Production hostname unexpectedly involved in review verification"
            exit 1
          fi
          echo "Verified deployed SHA: $DEPLOY_SHA"
