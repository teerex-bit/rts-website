name: Read Cloudflare review migration baseline

on:
  push:
    branches:
      - ops/deploy-rts-website-review-2026-09-24
    paths:
      - .github/workflows/read-cloudflare-review-baseline.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read current Pages, Worker domains, and website DNS
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api_get() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4$1"
          }

          project="$(api_get "/accounts/$CF_ACCOUNT_ID/pages/projects/rts-overview-review")"
          echo "$project" | jq -e '.success == true' >/dev/null
          echo "PAGES_PROJECT"
          echo "$project" | jq '{success, result: {name: .result.name, subdomain: .result.subdomain, source: .result.source, domains: .result.domains}}'

          pages_domains="$(api_get "/accounts/$CF_ACCOUNT_ID/pages/projects/rts-overview-review/domains")"
          echo "$pages_domains" | jq -e '.success == true' >/dev/null
          echo "PAGES_DOMAINS"
          echo "$pages_domains" | jq '{success, result: [.result[] | {name, status, validation_data}]}'

          worker_domains="$(api_get "/accounts/$CF_ACCOUNT_ID/workers/domains")"
          echo "$worker_domains" | jq -e '.success == true' >/dev/null
          echo "WORKER_DOMAINS"
          echo "$worker_domains" | jq '{success, result: [.result[] | {id, hostname, service, environment, zone_id, zone_name, status}]}'

          zones="$(api_get "/zones?name=reformingthesoul.com&status=active")"
          echo "$zones" | jq -e '.success == true and (.result | length == 1)' >/dev/null
          zone_id="$(echo "$zones" | jq -r '.result[0].id')"
          records="$(api_get "/zones/$zone_id/dns_records?per_page=100")"
          echo "$records" | jq -e '.success == true' >/dev/null
          echo "WEBSITE_DNS"
          echo "$records" | jq '[.result[] | select(.name == "review.reformingthesoul.com" or .name == "reformingthesoul.com" or .name == "www.reformingthesoul.com") | {type, name, content, proxied, ttl}]'
        