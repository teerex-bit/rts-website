name: Test Books click analytics

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/worker.js"
      - "public/books/books.js"
      - "public/books/catalog.json"
      - "tests/books-click-analytics.test.mjs"
      - ".github/workflows/test-books-click-analytics.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test click event recording and input validation
        run: node --test tests/books-click-analytics.test.mjs
