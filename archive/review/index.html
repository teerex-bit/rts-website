<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RTS Website Review</title>
  <link rel="stylesheet" href="../assets/css/review-switcher.css">
</head>
<body>
  <header class="review-bar">
    <div class="review-heading">
      <div class="review-title"><span>NEW RTS WEBSITE REVIEW</span><strong>Public Site + Formation Journey</strong></div>
      <p>Choose any assembled page below to review the new website before it goes live.</p>
    </div>
    <nav class="page-grid" aria-label="Overview Website pages">
      <button class="page-card is-current" data-url="/"><b>00</b><span>Home<small>Public Site</small></span></button>
      <button class="page-card" data-url="/formation/"><b>01</b><span>Formation<small>Public Site</small></span></button>
      <button class="page-card" data-url="/conversations/"><b>02</b><span>Conversations<small>Public Site</small></span></button>
      <button class="page-card" data-url="/books/"><b>03</b><span>Books<small>Public Site</small></span></button>
      <button class="page-card" data-url="/music/"><b>04</b><span>Music<small>Public Site</small></span></button>
      <button class="page-card" data-url="/doorway/"><b>05</b><span>Doorway<small>Formation Journey</small></span></button>
      <button class="page-card" data-url="/awaken/lesson-1/"><b>06</b><span>Awaken 1<small>Awaken</small></span></button>
      <button class="page-card" data-url="/awaken/lesson-2/"><b>07</b><span>Awaken 2<small>Awaken</small></span></button>
      <button class="page-card" data-url="/see-clearly/"><b>08</b><span>See Clearly Intro<small>See Clearly</small></span></button>
      <button class="page-card" data-url="/see-clearly/part-1/"><b>09</b><span>See Myself Clearly<small>See Clearly</small></span></button>
      <button class="page-card" data-url="/see-clearly/lesson-2/"><b>10</b><span>See God Clearly<small>See Clearly</small></span></button>
      <button class="page-card" data-url="/see-clearly/integration/"><b>11</b><span>Integration<small>See Clearly</small></span></button>
      <button class="page-card" data-url="/become/"><b>12</b><span>Become Intro<small>Become</small></span></button>
      <button class="page-card" data-url="/become/live-with-god/"><b>13</b><span>Live With God<small>Become</small></span></button>
      <button class="page-card" data-url="/become/practice-forms-the-person/"><b>14</b><span>Practice<small>Become</small></span></button>
      <button class="page-card" data-url="/become/whole-person/"><b>15</b><span>Whole Person<small>Become</small></span></button>
      <button class="page-card" data-url="/become/fruit/"><b>16</b><span>Fruit<small>Become</small></span></button>
      <button class="page-card" data-url="/join/"><b>17</b><span>Join<small>Join</small></span></button>
      <button class="page-card" data-url="/join/useful/"><b>18</b><span>Useful<small>Join</small></span></button>
    </nav>
    <div class="review-controls">
      <button id="previous-page" type="button" aria-label="Previous completed page">← Previous</button>
      <span class="viewing">Viewing <strong id="current-page">Home</strong></span>
      <button id="next-page" type="button" aria-label="Next completed page">Next →</button>
      <a id="open-page" href="/" target="_blank" rel="noopener">Open page</a>
    </div>
  </header>
  <main class="review-stage">
    <iframe id="page-frame" title="Selected RTS Overview page" src="/"></iframe>
  </main>
  <script>
    const cards = [...document.querySelectorAll('.page-card[data-url]')];
    const frame = document.querySelector('#page-frame');
    const title = document.querySelector('#current-page');
    const open = document.querySelector('#open-page');
    const previous = document.querySelector('#previous-page');
    const next = document.querySelector('#next-page');
    const completed = cards.map(card => ({ url: card.dataset.url, label: card.querySelector('span').childNodes[0].textContent.trim() }));

    function showPage(url, updateHistory = true) {
      const index = completed.findIndex(page => page.url === url);
      if (index < 0) return;
      const freshUrl = `${url}${url.includes('?') ? '&' : '?'}review_refresh=${Date.now()}`;
      frame.src = freshUrl;
      frame.dataset.route = url;
      title.textContent = completed[index].label;
      open.href = freshUrl;
      previous.disabled = index === 0;
      next.disabled = index === completed.length - 1;
      cards.forEach(card => card.classList.toggle('is-current', card.dataset.url === url));
      if (updateHistory) history.replaceState(null, '', `?page=${encodeURIComponent(url)}`);
    }

    cards.forEach(card => card.addEventListener('click', () => showPage(card.dataset.url)));
    previous.addEventListener('click', () => {
      const index = completed.findIndex(page => page.url === frame.dataset.route);
      if (index > 0) showPage(completed[index - 1].url);
    });
    next.addEventListener('click', () => {
      const index = completed.findIndex(page => page.url === frame.dataset.route);
      if (index < completed.length - 1) showPage(completed[index + 1].url);
    });

    const requested = new URLSearchParams(location.search).get('page');
    showPage(completed.some(page => page.url === requested) ? requested : '/', false);
  </script>
</body>
</html>
