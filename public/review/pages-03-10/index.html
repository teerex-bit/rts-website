<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Reforming the Soul — Review Pages 03–10"><title>Review Pages 03–10 | Reforming the Soul</title><link rel="stylesheet" href="/assets/styles.css"><script defer src="/assets/site.js"></script></head><body><main class="pages-batch-review">
    <header class="pages-batch-review__header">
      <div><p>Editable webpage review</p><h1>Pages 03–10</h1></div>
      <p>Switch pages below. The selected route stays live and interactive inside this same-origin viewer.</p>
    </header>
    <nav class="pages-batch-review__pages" aria-label="Pages 03 through 10"><button type="button" data-review-route="/awaken/pay-attention/" class="is-current" aria-pressed="true"><span>03</span><strong>Pay Attention</strong><small>Awaken</small></button><button type="button" data-review-route="/awaken/name-your-desire/" class="" aria-pressed="false"><span>04</span><strong>Name Your Desire</strong><small>Awaken</small></button><button type="button" data-review-route="/awaken/listen-within/" class="" aria-pressed="false"><span>05</span><strong>Listen Within</strong><small>Awaken</small></button><button type="button" data-review-route="/awaken/practice-presence/" class="" aria-pressed="false"><span>06</span><strong>A Practice of Presence</strong><small>Awaken</small></button><button type="button" data-review-route="/see-clearly/" class="" aria-pressed="false"><span>07</span><strong>See Clearly I</strong><small>See Clearly</small></button><button type="button" data-review-route="/see-clearly/your-formation/" class="" aria-pressed="false"><span>08</span><strong>Your Formation</strong><small>See Clearly</small></button><button type="button" data-review-route="/see-clearly/family-of-origin/" class="" aria-pressed="false"><span>09</span><strong>Family of Origin</strong><small>See Clearly</small></button><button type="button" data-review-route="/see-clearly/patterns/" class="" aria-pressed="false"><span>10</span><strong>Patterns and Protection</strong><small>See Clearly</small></button></nav>
    <section class="pages-batch-review__controls" aria-label="Review controls">
      <button type="button" data-review-previous>← Previous</button>
      <p><span>Viewing</span> <strong data-review-status>Page 03 — Pay Attention</strong></p>
      <button type="button" data-review-next>Next →</button>
    </section>
    <div class="pages-batch-review__viewer"><iframe id="batch-review-frame" src="/awaken/pay-attention/" title="Page 03 — Pay Attention"></iframe></div>
  </main>
  <script>(()=>{const buttons=[...document.querySelectorAll('[data-review-route]')],frame=document.querySelector('#batch-review-frame'),status=document.querySelector('[data-review-status]');let current=0;const select=index=>{current=(index+buttons.length)%buttons.length;buttons.forEach((button,buttonIndex)=>{const active=buttonIndex===current;button.classList.toggle('is-current',active);button.setAttribute('aria-pressed',String(active))});const button=buttons[current],label='Page '+button.querySelector('span').textContent+' — '+button.querySelector('strong').textContent;frame.src=button.dataset.reviewRoute;frame.title=label;status.textContent=label;button.scrollIntoView({block:'nearest',inline:'nearest'})};buttons.forEach((button,index)=>button.addEventListener('click',()=>select(index)));document.querySelector('[data-review-previous]').addEventListener('click',()=>select(current-1));document.querySelector('[data-review-next]').addEventListener('click',()=>select(current+1));})();</script></body></html>
